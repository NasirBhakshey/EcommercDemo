services:

  # =========================================================
  # PostgreSQL
  # =========================================================
  postgres:
    image: postgres:15
    container_name: postgres-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "8090:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - microservices-net


  # =========================================================
  # Config Server
  # =========================================================
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile

    container_name: config-server

    ports:
      - "8888:8888"

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 30s

    networks:
      - microservices-net


  # =========================================================
  # Eureka Server
  # =========================================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile

    container_name: eureka-server

    ports:
      - "8761:8761"

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 30s

    environment:
      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      config-server:
        condition: service_healthy

    networks:
      - microservices-net


  # =========================================================
  # User Service
  # =========================================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile

    container_name: user-service

    expose:
      - "8081"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: user-service

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started

    networks:
      - microservices-net


  # =========================================================
  # Role Service
  # =========================================================
  role-service:
    build:
      context: ./role-service
      dockerfile: Dockerfile

    container_name: role-service

    expose:
      - "8082"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/role_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: role-service

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started

    networks:
      - microservices-net


  # =========================================================
  # Product Service
  # =========================================================
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile

    container_name: product-service

    expose:
      - "8083"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/product_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: product-service

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started

    networks:
      - microservices-net


  # =========================================================
  # Order Service
  # =========================================================
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile

    container_name: order-service

    expose:
      - "8084"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: order-service

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started

    networks:
      - microservices-net


  # =========================================================
  # Notification Service
  # =========================================================
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile

    container_name: notification-service

    expose:
      - "8085"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: notification-service

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started

    networks:
      - microservices-net


  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service

    expose:
      - "8086"

    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: payment-service

      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started

    networks:
      - microservices-net


  # =========================================================
  # API Gateway
  # =========================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile

    container_name: api-gateway

    ports:
      - "8080:8080"

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

    depends_on:
      - eureka-server
      - user-service
      - role-service
      - product-service
      - order-service

    networks:
      - microservices-net


  # =========================================================
  # Kafka - KRaft Mode
  # =========================================================
  kafka:
    image: apache/kafka:latest
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - microservices-net


# =========================================================
# Volumes
# =========================================================
volumes:
  pgdata:
  kafka-data:


# =========================================================
# Network
# =========================================================
networks:
  microservices-net:
    driver: bridge